spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/airhealth
spring.datasource.username=airhealth
spring.datasource.password=${POSTGRESQL_PASSWORD_AIRHEALTH}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
openmeteo.air-url=https://air-quality-api.open-meteo.com

jwt.secret=${JWT_SECRET_AIRHEALTH}
jwt.expiration-ms=86400000

air.cache.ttl-seconds=1800
air.cache.max-entries=500

alert.cooldown-minutes=360
