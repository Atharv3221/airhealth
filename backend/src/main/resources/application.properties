spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/airhealth
spring.datasource.username=airhealth
spring.datasource.password=${POSTGRESQL_PASSWORD_AIRHEALTH}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
openmeteo.air-url=https://air-quality-api.open-meteo.com
openmeteo.geocoding-url=https://geocoding-api.open-meteo.com
nominatim.url=https://nominatim.openstreetmap.org
# Nominatim's usage policy asks for an identifying User-Agent; add contact details for real deployments
nominatim.user-agent=${NOMINATIM_USER_AGENT:AirHealth/0.1 (hackathon project)}
places.reverse-cache.max-entries=1000

jwt.secret=${JWT_SECRET_AIRHEALTH}
jwt.expiration-ms=86400000

air.cache.ttl-seconds=1800
air.cache.max-entries=500

alert.cooldown-minutes=360
